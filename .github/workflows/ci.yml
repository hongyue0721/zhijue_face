# CI：仓库已推送 origin/main，本工作流在 push/PR 实际执行。
# 设计约束：默认不花模型费用——不调用任何 embedding/LLM 端点；
# integration_live 用例在本地与 CI 都被显式 deselect，只能由负责人
# 用私密 env 与预算授权后通过 make test-live 单独执行。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.10"

      - name: Install locked Python
        run: uv python install 3.11

      - name: Sync from lock (fails on drift)
        run: uv sync --frozen --python 3.11

      - name: Lint and format check (src tests smoke migrations)
        run: |
          .venv/bin/ruff check src tests smoke migrations
          .venv/bin/ruff format --check src tests smoke migrations

      - name: Tests (no model spend; live cases deselected like local make test)
        run: .venv/bin/python -m pytest tests -q -m 'not integration_live'

      - name: Spec and repo integrity (offline profile)
        run: |
          .venv/bin/python ../../tools/validate_spec.py
          sha256sum -c ../../CHECKSUMS.sha256

      - name: Doctor offline readiness (source + locked deps; no network, no secrets)
        run: .venv/bin/python ../../scripts/doctor.py

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Frontend contract tests
        run: pnpm test

      - name: Typecheck and build
        run: pnpm build
